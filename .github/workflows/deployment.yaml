name: Build

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    name: 🏗 Astro build
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⬢ Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 📥 Install deps
        run: npm ci

      - name: 🏗 Build
        run: npm run build

      - name: 🔍 Check the machine edition built
        run: |
          test -f dist/llms.txt || { echo "llms.txt missing"; exit 1; }
          count=$(ls dist/notes/*.md 2>/dev/null | wc -l | tr -d ' ')
          test "$count" -gt 0 || { echo "no markdown twins were generated"; exit 1; }
          echo "ok: llms.txt plus $count markdown twin(s)"
