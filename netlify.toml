[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

  # @netlify/plugin-nextjs is still installed on the site from the Netlify UI,
  # which a repo cannot uninstall. Its onBuild step inspects the publish
  # directory, finds an Astro build rather than a Next one, and fails the
  # deploy even though the build itself succeeded. This is the escape hatch the
  # plugin's own error message documents. Delete this line once the plugin has
  # been uninstalled in the dashboard.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
